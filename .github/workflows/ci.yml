name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — la versión la fija `packageManager` en package.json
      # (pnpm@9.15.9). Ponerla en ambos sitios rompe action-setup@v4
      # ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @crisol/web build

  # ─────────────────────────────────────
  # Backend (Postgres + pgvector as service container)
  # ─────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crisol
          POSTGRES_PASSWORD: crisol
          POSTGRES_DB: crisol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://crisol:crisol@localhost:5432/crisol
      JWT_SECRET_KEY: ci-only-not-secret
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Black (format check)
        run: black --check app tests

      - name: Mypy (typecheck)
        run: mypy app

      - name: Alembic upgrade + parity check (migrations <-> models)
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest -v --tb=short
