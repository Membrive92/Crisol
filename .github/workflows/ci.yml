name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — la versión la fija `packageManager` en package.json
      # (pnpm@9.15.9). Ponerla en ambos sitios rompe action-setup@v4
      # ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Código muerto. Es un eje ORTOGONAL a lint y typecheck, no un extra de
      # ellos: `noUnusedLocals` y `no-unused-vars` son de ámbito fichero y un
      # `export` está usado por definición, así que ninguno de los dos puede ver
      # que nadie importa un módulo (lección PHASE-43). Vivía sólo en
      # `make verify`, que NO es lo que corre en un push: entre PHASE-43 y
      # PHASE-44.21 no se ejecutó en ningún commit.
      - name: Knip (código muerto)
        run: pnpm knip

      - name: Build web
        run: pnpm --filter @crisol/web build

  # ─────────────────────────────────────
  # Backend (Postgres + pgvector as service container)
  # ─────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crisol
          POSTGRES_PASSWORD: crisol
          POSTGRES_DB: crisol
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://crisol:crisol@localhost:5432/crisol
      JWT_SECRET_KEY: ci-only-not-secret
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt: pin EXACTO (generado con `make deps-lock`) para
          # que CI instale lo mismo que local y no diverjan versiones (mypy/SQLAlchemy).
          python -m pip install -e ".[dev]" -c constraints.txt

      # `scripts/` entra: son los data-fix y los seeds, que se ejecutan CONTRA
      # LOS DATOS DEL USUARIO. Quedaban fuera de lo que verifica CI —y de
      # `make lint`— mientras la verificación a mano sí los incluía, así que un
      # fallo de estilo o un import sin usar en un script de migración de datos
      # sólo aparecía si alguien se acordaba de escribir la ruta.
      - name: Ruff (lint)
        run: ruff check app tests scripts

      - name: Black (format check)
        run: black --check app tests scripts

      - name: Mypy (typecheck)
        run: mypy app scripts

      - name: Alembic upgrade + parity check (migrations <-> models)
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest -v --tb=short

      # Corre en el job de backend porque necesita Python y leer
      # `alembic/versions/`. No depende de las deps del backend (stdlib pura),
      # así que da igual el orden respecto a los pasos de arriba.
      - name: Docs check (podredumbre documental)
        working-directory: .
        run: python scripts/check_docs.py
