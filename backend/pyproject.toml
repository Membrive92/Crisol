[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisol-backend"
version = "0.0.0"
description = "Crisol — backend FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "argon2-cffi>=23.1.0",
  "PyJWT[crypto]>=2.9.0",
  "email-validator>=2.2.0",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "webauthn>=2.0.0",
  "apscheduler>=3.10.4",
  # Fundamentales EDGAR (PHASE-44.6). PINEADA a la versión con la que se validó
  # el cruzado contra MCD/O/JNJ: su modelo de hechos (`FinancialFact`) es la
  # frontera del adapter, y un cambio de semántica entre versiones movería los
  # números sin tocar una línea de nuestro código.
  "edgartools==5.43.0",
  # Cotizaciones (PHASE-44.11). PINEADA: no es un API oficial sino un cliente de
  # los endpoints públicos de Yahoo, así que su forma de salida puede cambiar
  # entre versiones sin previo aviso — y el desajuste no lanzaría, simplemente
  # dejaría de haber precios. La 1.5.2 es con la que se verificó el contrato
  # (`fast_info` → float, `'GBp'` en Londres, KeyError en símbolo inexistente).
  "yfinance==1.5.2",
  # Declaradas EXPLÍCITAMENTE aunque llegasen como transitivas de `edgartools`
  # y `yfinance` (PHASE-44.14). Ya no son incidentales: el índice del buscador
  # lee el parquet de emisores con pandas —la ruta pyarrow devuelve la tabla
  # sin la columna `exchange`, así que no hay alternativa— y el parser FIRDS
  # recorre 800 MB de XML con `lxml.iterparse`. Una transitiva sin declarar es
  # una dependencia que desaparece el día que su padre cambie de opinión, y el
  # fallo sería silencioso: el buscador se queda mudo, no revienta.
  "pandas>=2.2",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "types-openpyxl>=3.1.5",
  "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID", "RUF"]
# E501: line length handled by black (line-length above).
# RUF001/2/3: "ambiguous unicode" (×, −, …) — false positives in a Spanish
# codebase that uses real typographic/math symbols in docstrings & comments;
# ignoring avoids whack-a-mole every time a new "×"/"−" is written in prose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions|\\.venv"

[tool.mypy]
python_version = "3.12"
strict = true
# `execute().rowcount` (DML) lo exponen unos stubs de SQLAlchemy y otros no,
# según la versión resuelta (CI vs local divergen). Los `type: ignore` de
# `rowcount` son necesarios donde no lo reconoce; esto evita que salten como
# "unused" donde sí lo hace, sin depender de fijar la versión exacta.
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "\\.venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# `edgartools` no publica `py.typed`. El adapter lo trata como frontera sin
# tipos (`Any` + `getattr` defensivo) y convierte a `XbrlFact` en un único
# sitio, así que el resto del módulo sigue estrictamente tipado.
[[tool.mypy.overrides]]
module = ["edgar.*"]
ignore_missing_imports = true

# yfinance no publica `py.typed`. El adapter lo aísla en un único método
# (`_fast_info`) y convierte todo a `Decimal` en la frontera, así que el
# `Any` no se propaga más allá de esa función.
[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  # Exime del bloqueo global de `currency.client.fetch_rates` (conftest). Sólo
  # para los tests del PROPIO cliente: a ésos el bloqueo les parchearía justo lo
  # que quieren verificar. No implica red — mockean `httpx` por dentro.
  "real_fx_client: el test verifica el cliente de tipos de cambio en sí",
  # Exime del vaciado global del índice de emisores de la SEC (conftest). Sólo
  # para el test que verifica el CONTRATO con el parquet de `edgartools`: al
  # resto le haría depender sus aserciones de 10.365 filas reales que cambian
  # con cada bump de la librería. No implica red — el parquet va empaquetado.
  "real_symbol_index: el test verifica el índice real de emisores de la SEC",
]
